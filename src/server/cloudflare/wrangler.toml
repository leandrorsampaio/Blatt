# Blatt server on Cloudflare Workers -- setup steps in src/server/README.md
name = "blatt"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# cv.html and its app/ folder are uploaded as static assets. The list of what to
# upload is the .assetsignore file at the repository root. The worker runs first
# on every request, so nothing is served before sign-in.
[assets]
directory = "../../.."
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# No database_id needed: the first `npx wrangler deploy` creates the "blatt"
# database in your account and reuses it on every later deploy.
[[d1_databases]]
binding = "DB"
database_name = "blatt"

# Settings are secrets, not plain vars -- set each one with:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put ALLOWED_EMAIL
#   npx wrangler secret put SESSION_SECRET
# Optional, only for a custom domain:  npx wrangler secret put PUBLIC_URL
